[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mos-full-runtime"
version = "4.2.0"
description = "MOS portable embedded cognitive runtime R4.2"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[project.scripts]
mos = "mos.cli:main"
mos-server = "mos.service:main"
mos-portable = "mos.portable:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mos*"]
