name: MOS Hub Peer Report Egress

on:
  push:
    paths:
      - ".github/workflows/mos-hub-peer-egress.yml"
      - "runtime/hub-peer-egress/request.json"

permissions:
  contents: write

concurrency:
  group: mos-hub-peer-egress
  cancel-in-progress: false

jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore private transport key
        uses: actions/cache@v4
        with:
          path: ~/.cache/mos-hub-peer-egress/private.pem
          key: mos-hub-peer-egress-rsa-v1

      - name: Ensure RSA transport key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mos-hub-peer-egress" runtime/hub-peer-egress
          if [ ! -s "$HOME/.cache/mos-hub-peer-egress/private.pem" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072               -out "$HOME/.cache/mos-hub-peer-egress/private.pem" >/dev/null 2>&1
            chmod 600 "$HOME/.cache/mos-hub-peer-egress/private.pem"
          fi
          openssl pkey -in "$HOME/.cache/mos-hub-peer-egress/private.pem" -pubout             -out runtime/hub-peer-egress/public.pem >/dev/null 2>&1

      - name: Publish public transport key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mos-hub-peer-egress-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/hub-peer-egress/public.pem
          if ! git diff --cached --quiet; then
            git commit -m "MOS Hub peer egress public key"
            git push
          fi

      - name: Execute authenticated Hub operations
        if: ${{ hashFiles('runtime/hub-peer-egress/request.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, subprocess, urllib.error, urllib.request
          from pathlib import Path

          root = Path("runtime/hub-peer-egress")
          req = json.loads((root / "request.json").read_text(encoding="utf-8"))
          Path("/tmp/mos_token.enc").write_bytes(base64.b64decode(req["ciphertext_b64"]))
          subprocess.run([
              "openssl","pkeyutl","-decrypt",
              "-inkey",str(Path.home()/".cache/mos-hub-peer-egress/private.pem"),
              "-in","/tmp/mos_token.enc","-out","/tmp/mos_token.txt",
              "-pkeyopt","rsa_padding_mode:oaep","-pkeyopt","rsa_oaep_md:sha256"
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          token = Path("/tmp/mos_token.txt").read_text(encoding="utf-8").strip()
          hub = req["hub_url"].rstrip("/")

          def call(method, path, body=None, auth=True):
              data = None if body is None else json.dumps(body,ensure_ascii=False,separators=(",",":")).encode("utf-8")
              headers={"Accept":"application/json","User-Agent":"mos-gpt-peer-egress/1"}
              if data is not None: headers["Content-Type"]="application/json"
              if auth: headers["Authorization"]="Bearer "+token
              r=urllib.request.Request(hub+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      raw=x.read().decode("utf-8","replace")
                      try: b=json.loads(raw)
                      except Exception: b={"raw":raw[:4000]}
                      return {"status":x.status,"body":b}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try: b=json.loads(raw)
                  except Exception: b={"raw":raw[:4000]}
                  return {"status":e.code,"body":b}

          sends=[]
          for envelope in req.get("messages",[]):
              sends.append({
                  "message_id": envelope["message_id"],
                  "recipient": envelope["recipient"],
                  "result": call("POST","/v1/messages",envelope,True)
              })
          mailbox = call("GET","/v1/mailbox/mos-gpt?after=0&limit=100",None,True)
          public = call("GET","/v1/public/messages?limit=100",None,False)
          wanted={x["message_id"] for x in req.get("messages",[])}
          seen=[]
          if public["status"]==200 and isinstance(public["body"],dict):
              for m in public["body"].get("messages",[]):
                  if m.get("message_id") in wanted and m.get("sender")=="mos-gpt":
                      seen.append(m.get("message_id"))
          (root/"result.json").write_text(json.dumps({
              "sends":sends,
              "mailbox":mailbox,
              "public_status":public["status"],
              "public_seen":sorted(seen),
              "token_exposed":False
          },ensure_ascii=False,indent=2),encoding="utf-8")
          Path("/tmp/mos_token.txt").unlink(missing_ok=True)
          Path("/tmp/mos_token.enc").unlink(missing_ok=True)
          PY

      - name: Persist receipt and remove encrypted request
        if: ${{ hashFiles('runtime/hub-peer-egress/request.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mos-hub-peer-egress-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/hub-peer-egress/result.json
          git rm -f runtime/hub-peer-egress/request.json
          git commit -m "MOS Hub peer egress receipt"
          git push
